# =============================================================================
# vas-ruthai-deploy — Merged VAS + Ruth AI deployment
# =============================================================================
#
# Imports VAS service definitions from ../vas-ms-v2/deploy/docker-compose.yml
# (sibling clone) and inlines Ruth AI services until ruth-ai-vas-ms-v2 grows
# its own deploy/ subdirectory.
#
# Layout assumed (siblings under /home/project or wherever you clone):
#   ../vas-ms-v2/                  ← VAS app repo, has deploy/
#   ../ruth-ai-vas-ms-v2/          ← Ruth AI repo (no deploy/ yet)
#   ./vas-ruthai-deploy/           ← this repo, where you run docker compose
#
# Usage:
#   ./bootstrap.sh                 # clones siblings if missing, prompts for .env
#   docker compose up -d
#   open http://${HOST_IP}:${VAS_HTTP_PORT}
#
# When ruth-ai-vas-ms-v2 gains its own deploy/docker-compose.yml, replace
# the inlined Ruth AI services block below with a second include:
#   include:
#     - ../vas-ms-v2/deploy/docker-compose.yml
#     - ../ruth-ai-vas-ms-v2/deploy/docker-compose.yml
# =============================================================================

include:
  - ../vas-ms-v2/deploy/docker-compose.yml

# Log rotation for every service. Without it json-file grows without
# bound: the store runtime had reached 872 MB of inference lines on a
# disk already at 85%. 50m x 5 caps each container at 250 MB.
#
# How much history that buys depends entirely on the service. Quiet ones
# keep months. The store runtime at 12 cameras x 4 models writes ~38
# lines/s (~43 MB/h) while models are in trial mode, so 250 MB is only
# about SIX HOURS. If a trial needs a longer look-back than that, either
# raise its cap here or archive the window first — see
# /mnt/storage/ruth-models/eval/2026-10-18/trial-logs/.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

# While models are in trial mode the store runtime writes ~43 MB/h, so the
# default 250 MB is only about six hours. 200m x 10 = 2 GB keeps roughly
# two days, long enough to look back over a trial. Drop this override once
# the trial blocks come out of the manifests.
x-logging-store-runtime: &store-runtime-logging
  driver: json-file
  options:
    max-size: "200m"
    max-file: "10"

services:

  # ──────────────────────────────────────────────────────────────────────
  # VAS service overrides
  # Pin container names AND data volumes to the historical vas-ms-v2-*
  # names so the merged stack reuses live data from the pre-restructure
  # deploy. The standalone compose parameterizes volume names with
  # ${COMPOSE_PROJECT_NAME}; the merged stack overrides that here.
  # ──────────────────────────────────────────────────────────────────────
  vas-db:
    logging: *default-logging
    container_name: vas-ms-v2-db
    volumes:
      - vas-ms-v2-postgres-data:/var/lib/postgresql/data
  vas-redis:
    logging: *default-logging
    container_name: vas-ms-v2-redis
    volumes:
      - vas-ms-v2-redis-data:/data
  vas-mediasoup:
    logging: *default-logging
    container_name: vas-ms-v2-mediasoup
    environment:
      # Integration layer uses a single operator-facing host-IP knob:
      # HOST_IP in the .env. VAS's mediasoup-server reads
      # MEDIASOUP_ANNOUNCED_IP internally (its own var, unchanged
      # in the VAS standalone path); we map HOST_IP -> that var here
      # so the operator only sets one value.
      MEDIASOUP_ANNOUNCED_IP: ${HOST_IP:?HOST_IP must be set in .env (host IP reachable by browser clients)}
  vas-backend:
    logging: *default-logging
    container_name: vas-ms-v2-backend
    # The AI frame tap writes one JPEG per live stream to /dev/shm (see
    # rtsp_pipeline Output 3). Actual use is tiny — `-update 1` overwrites a
    # single file per stream, so ~2x 250KB per camera including the atomic
    # temp file, a few MB at any realistic camera count. The headroom matters
    # because a full tmpfs would fail ffmpeg's write and take down the whole
    # process, live WebRTC feed included; 256m removes that as a concern.
    shm_size: "256m"
    environment:
      # VAS<->Ruth credential contract. The operator sets a single
      # VAS_CLIENT_SECRET in the integration .env; compose maps it
      # to both sides:
      #   - VAS:  seeds the ruth-ai-backend OAuth client at startup
      #           via seed_ruth_client() — see vas-ms-v2 main.py
      #   - Ruth: reads it as VAS_CLIENT_SECRET to authenticate.
      # VAS standalone leaves VAS_RUTH_CLIENT_SECRET unset and skips
      # the seeding entirely (no-op, single info log line).
      VAS_RUTH_CLIENT_SECRET: ${VAS_CLIENT_SECRET:?VAS_CLIENT_SECRET must be set in .env (VAS<->Ruth contract)}
      # Bookmark clip encoder. Base compose is the CPU flavour, so default
      # to libx264 (no GPU needed). The GPU overlay (docker-compose.gpu.yml)
      # overrides this to h264_nvenc for the GPU flavour. Without this,
      # code defaults to h264_nvenc (bookmarks.py:197) and CPU-only boxes
      # fail every bookmark encode with "Cannot load libcuda.so.1".
      BOOKMARK_VIDEO_CODEC: "${BOOKMARK_VIDEO_CODEC:-libx264}"
  vas-frontend:
    logging: *default-logging
    container_name: vas-ms-v2-frontend
    # vas-frontend sits behind vas-nginx (the VAS edge proxy, below)
    # — exactly as it does in VAS standalone. The included compose
    # already binds it to 127.0.0.1:${VAS_FRONTEND_HOST_PORT}; no
    # override needed. Operators reach VAS through vas-nginx on
    # ${VAS_HTTP_PORT}, which fronts the SPA, the API, the MediaSoup
    # signaling WebSocket (/ws/), and HLS (/static/hot/) on one
    # origin — same shape as standalone.
  vas-nginx:
    logging: *default-logging
    container_name: vas-ms-v2-nginx
    # VAS's edge proxy. Re-enabled in the integrated deployment
    # because vas-frontend's SPA assumes same-origin routing for
    # API calls AND the MediaSoup signaling WebSocket — without
    # vas-nginx, /ws/signaling has no working route and feeds
    # don't start.
    #
    # vas-nginx runs network_mode: host. Its templated server block
    # listens on ${VAS_HTTP_PORT:-8086}, not 80 — but the stock
    # nginx:alpine image ships /etc/nginx/conf.d/default.conf with
    # a `listen 80;` block that we MUST suppress, or it tries to
    # bind host :80 (which Ruth owns) on startup. We mask it by
    # bind-mounting an empty file over it. The container's own
    # /etc/nginx/templates/vas.conf.template is unaffected and
    # still produces /etc/nginx/conf.d/vas.conf at startup.
    volumes:
      - ./nginx/empty.conf:/etc/nginx/conf.d/default.conf:ro

  # ──────────────────────────────────────────────────────────────────────
  # Ruth AI services
  # TODO(repo-split): when ruth-ai-vas-ms-v2 grows its own deploy/ dir,
  # move these definitions there and add a second `include:` line above.
  # Build contexts here use sibling-relative paths (../ruth-ai-vas-ms-v2/...)
  # which assumes the repo layout described in the file header.
  # ──────────────────────────────────────────────────────────────────────

  ruth-ai-db:
    logging: *default-logging
    image: postgres:15-alpine
    container_name: ruth-ai-vas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${RUTH_POSTGRES_USER:-ruth}
      POSTGRES_PASSWORD: ${RUTH_POSTGRES_PASSWORD:?RUTH_POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${RUTH_POSTGRES_DB:-ruth_ai}
    ports:
      - "${RUTH_DB_HOST_PORT:-5434}:5432"
    volumes:
      - ruth-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${RUTH_POSTGRES_USER:-ruth} -d ${RUTH_POSTGRES_DB:-ruth_ai}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - ruth-ai-internal

  ruth-ai-redis:
    logging: *default-logging
    image: redis:7-alpine
    container_name: ruth-ai-vas-redis
    restart: unless-stopped
    ports:
      - "${RUTH_REDIS_HOST_PORT:-6382}:6379"
    volumes:
      - ruth-redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - ruth-ai-internal

  ruth-ai-backend:
    logging: *default-logging
    build:
      context: ../ruth-ai-vas-ms-v2/ruth-ai-backend
      dockerfile: Dockerfile
    container_name: ruth-ai-vas-backend
    restart: unless-stopped
    ports:
      - "${RUTH_BACKEND_HOST_PORT:-8090}:8080"
    environment:
      RUTH_AI_ENV: ${RUTH_AI_ENV:-development}
      RUTH_AI_LOG_LEVEL: ${RUTH_AI_LOG_LEVEL:-info}
      RUTH_AI_LOG_FORMAT: json
      HOST: 0.0.0.0
      PORT: 8080
      DATABASE_URL: postgresql+asyncpg://${RUTH_POSTGRES_USER:-ruth}:${RUTH_POSTGRES_PASSWORD}@ruth-ai-db:5432/${RUTH_POSTGRES_DB:-ruth_ai}
      DATABASE_POOL_SIZE: 10
      DATABASE_POOL_OVERFLOW: 5
      REDIS_URL: redis://ruth-ai-redis:6379/0
      REDIS_MAX_CONNECTIONS: 50
      # Integration glue: Ruth AI reaches VAS via host gateway since VAS
      # backend uses network_mode: host. Port comes from the same env var
      # the included VAS compose uses, so they stay in sync.
      VAS_BASE_URL: http://host.docker.internal:${VAS_BACKEND_PORT:-8085}
      VAS_CLIENT_ID: ${VAS_CLIENT_ID:-ruth-ai-backend}
      VAS_CLIENT_SECRET: ${VAS_CLIENT_SECRET:?VAS_CLIENT_SECRET must be set in .env}
      VAS_TOKEN_REFRESH_MARGIN_SEC: 300
      VAS_REDIS_URL: redis://host.docker.internal:${VAS_REDIS_HOST_PORT:-6380}
      JWT_SECRET_KEY: ${RUTH_JWT_SECRET:?RUTH_JWT_SECRET must be set in .env}
      JWT_ALGORITHM: HS256
      JWT_EXPIRY_MINUTES: 60
      # Admin login for the Model Management page (/api/v1/admin only).
      # Unset = admin API returns 503; nothing else is affected.
      RUTH_ADMIN_USERNAME: ${RUTH_ADMIN_USERNAME:-}
      RUTH_ADMIN_PASSWORD_HASH: ${RUTH_ADMIN_PASSWORD_HASH:-}
      # nginx (frontend container) sets X-Real-IP; trust it only from there.
      RUTH_ADMIN_TRUSTED_PROXY_HOSTS: ruth-ai-vas-frontend
      # NLP Chat is intentionally disabled in this deploy (GPU 1 reassigned
      # to vas-backend nvenc). Setting NLP_CHAT_ENABLED=false makes Ruth
      # skip the startup connect, return "disabled" from the health check,
      # and stop dragging overall health to "unhealthy". Restore to true
      # if/when the ruth-ai-nlp-chat + ollama services come back online.
      NLP_CHAT_ENABLED: "false"
      NLP_CHAT_SERVICE_URL: http://ruth-ai-nlp-chat:8081
      NLP_CHAT_TIMEOUT_SECONDS: ${NLP_CHAT_TIMEOUT_SECONDS:-120}
      UNIFIED_RUNTIME_URL: http://unified-ai-runtime:8000
      UNIFIED_RUNTIME_ENABLE: "true"
      UNIFIED_RUNTIME_TIMEOUT: ${UNIFIED_RUNTIME_TIMEOUT:-30.0}
      # Uploaded models (model store) run in model-store-runtime. Empty = off:
      # every model goes to unified-ai-runtime, exactly as before. To enable,
      # set MODEL_STORE_RUNTIME_URL=http://model-store-runtime:8000 in .env.
      MODEL_STORE_RUNTIME_URL: ${MODEL_STORE_RUNTIME_URL:-}
      MODEL_STORE_RUNTIME_ID: model-store-runtime
      # RUTH_STORE_INFERENCE_CONCURRENCY — uploaded models' own in-flight
      # budget (default 2 in code; built-in models use
      # RUTH_INFERENCE_CONCURRENCY, also 2). Deliberately NOT set.
      #
      # Measured 2026-10-17 after the store runtime's offload flag went on:
      # the existing budget of 2 is occupied only 33% of the time and mean
      # concurrency is 1.02, so the backend is not blocking on it. At 65ms
      # mean latency two slots could serve ~30 req/s; it is serving 16.
      # The limiter is upstream — InferenceBudget's pacing
      # (RUTH_INFERENCE_TARGET_FPS 2.0, RUTH_INFERENCE_MIN_FPS 0.2,
      # RUTH_INFERENCE_MAX_GPU_UTIL 2.3). Raising this alone widens a door
      # that is already ajar.
      #
      # Raise it only together with the pacer, and measure both. See BL-5.
      # Model Management store (admin uploads). Missing or not writable by
      # appuser (uid 1000) = model-store API returns 503; nothing else changes.
      MODEL_STORE_ROOT: /store
      # Pre-archive backups for "Start new project". Missing or not writable
      # by appuser (uid 1000) = that one admin action refuses with 503;
      # nothing else is affected. A bind mount rather than a named volume so
      # the dumps are reachable from the host for off-box copying, and so
      # they survive `docker compose down -v`.
      PROJECT_BACKUP_DIR: /var/backups/ruth-ai
    volumes:
      - ${RUTH_MODEL_STORE_HOST_DIR:-/mnt/storage/ruth-models}:/store
      - ${RUTH_BACKUP_HOST_DIR:-/mnt/storage/ruth-backups}:/var/backups/ruth-ai
      # The JPEG each violation was actually inferred from. Written by the
      # backend (uid 1000) and served back by /violations/{id}/frame/image,
      # so it has to outlive the container like any other evidence.
      - ${RUTH_EVIDENCE_HOST_DIR:-/mnt/storage/ruth-evidence}:/evidence
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      ruth-ai-db:
        condition: service_healthy
      ruth-ai-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - ruth-ai-internal

  unified-ai-runtime:
    logging: *default-logging
    # Fixed image name: `docker compose up -d` reuses this tag when it exists
    # locally and does NOT rebuild. Rebuild only deliberately, with
    # `docker compose build unified-ai-runtime`. Deps are pinned via
    # ai/requirements-gpu.txt + ai/constraints-gpu.txt.
    image: ruth-ai-unified-runtime:2026.10-pinned
    build:
      context: ../ruth-ai-vas-ms-v2/ai
      dockerfile: Dockerfile
      args:
        - VARIANT=gpu
    container_name: ruth-ai-unified-runtime
    restart: unless-stopped
    ports:
      - "${RUTH_UNIFIED_RUNTIME_HOST_PORT:-8012}:8000"
    volumes:
      - ../ruth-ai-vas-ms-v2/ai/models:/app/ai/models:ro
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=info
      - MODELS_ROOT=/app/ai/models
      - MAX_CONCURRENT_INFERENCES=10
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8000
      - BACKEND_URL=http://ruth-ai-vas-backend:8080
      - BACKEND_INTEGRATION_ENABLED=true
      - BACKEND_HEALTH_PUSH_INTERVAL_SECONDS=30
      - YOLO_AUTOINSTALL=False
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    networks:
      - ruth-ai-internal
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]

  # Second runtime for uploaded models (Model Management store). Same code as
  # unified-ai-runtime; it only reads the models installed under
  # <store>/enabled/ (ai/store_plugin/install_enabled.py). Restarting it
  # ("Apply") affects only cameras running uploaded models.
  # Opt-in profile: plain `docker compose up -d` does not start it.
  #   docker compose --profile model-store up -d model-store-runtime
  #
  # Deliberately on a DIFFERENT image tag from unified-ai-runtime, which
  # stays on 2026.10-pinned. 2026.10-offload carries the BL-5 thread
  # hand-off; enabling it here only means the built-in runtime's path is
  # untouched in both code and configuration, so a regression can only
  # reach the three uploaded PPE models. Roll back by restoring
  # 2026.10-pinned and dropping RUTH_RUNTIME_OFFLOAD_INFERENCE below.
  model-store-runtime:
    logging: *store-runtime-logging
    image: ruth-ai-unified-runtime:2026.10-offload
    container_name: ruth-ai-model-store-runtime
    profiles: ["model-store"]
    restart: unless-stopped
    # The store is owned by uid 1000 (750/640); the image's default user
    # (ruth, uid 999) could not read it and would load nothing.
    user: "1000:1000"
    # No host port: only the backend talks to it, on ruth-ai-internal.
    volumes:
      - ${RUTH_MODEL_STORE_HOST_DIR:-/mnt/storage/ruth-models}/enabled:/store-models:ro
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=info
      - MODELS_ROOT=/store-models
      # Fixed id: the backend excludes it from system AI health, and restarts
      # don't leave stale random registrations behind.
      - RUNTIME_ID=model-store-runtime
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8000
      - BACKEND_URL=http://ruth-ai-vas-backend:8080
      - BACKEND_INTEGRATION_ENABLED=true
      - BACKEND_HEALTH_PUSH_INTERVAL_SECONDS=30
      - YOLO_AUTOINSTALL=False
      # uid 1000 has no home dir in the image; keep ultralytics' settings in /tmp.
      - YOLO_CONFIG_DIR=/tmp/ultralytics
      # BL-5: await sandbox_manager.execute() on a worker thread instead of
      # calling it inline, so the event loop can accept another request
      # while one is on the GPU. Without this the runtime serves exactly
      # one inference at a time across every camera and model (measured
      # 2026-10-17: max concurrency 1 over 8,141 spans, GPU at 29%).
      #
      # Set ONLY here. The same image code powers unified-ai-runtime,
      # where the flag is absent and the original inline call runs.
      # Thread safety was verified offline first: 480 concurrent calls per
      # model against a shared YOLO instance, zero divergence from serial
      # ground truth, so no per-model lock is needed.
      - RUTH_RUNTIME_OFFLOAD_INFERENCE=true
    healthcheck:
      # /health answers 200 even with no models loaded (an empty store is fine).
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    networks:
      - ruth-ai-internal
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 1G
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]

  # NOTE: ruth-ai-nlp-chat and ollama services are intentionally NOT
  # included here. They were disabled in the pre-restructure compose
  # (GPU 1 reassigned to vas-backend nvenc; ollama-dependent services
  # disabled as a result). Restore them in this file if/when GPU
  # capacity allows.

  ruth-ai-frontend:
    logging: *default-logging
    build:
      context: ../ruth-ai-vas-ms-v2/frontend
      dockerfile: Dockerfile
    container_name: ruth-ai-vas-frontend
    restart: unless-stopped
    ports:
      # Host port is operator-configurable via RUTH_FRONTEND_HOST_PORT;
      # default 80 gives a clean customer-facing URL (no :port suffix)
      # on appliances like the MCU. Operators can override (e.g. 3300)
      # if port 80 is already taken on the host. Container always
      # listens on 80 internally — see frontend/Dockerfile.
      - "${RUTH_FRONTEND_HOST_PORT:-80}:80"
    environment:
      VAS_PROXY_URL: http://host.docker.internal:${VAS_BACKEND_PORT:-8085}
      VITE_API_BASE_URL: http://localhost:8080
      VITE_VAS_WEBRTC_URL: ${VAS_WEBRTC_URL:-ws://10.40.128.10:3002}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - ruth-ai-internal


# =============================================================================
# NETWORKS
# =============================================================================
networks:
  ruth-ai-internal:
    name: ruth-ai-vas-internal
    driver: bridge


# =============================================================================
# VOLUMES
# =============================================================================
volumes:
  # VAS data volumes. Explicit `name:` directives mean Compose will
  # ADOPT an existing volume of the same name if one is on the host
  # (the project server's live data), and CREATE it on a fresh host
  # if absent. Either way no operator pre-step is required.
  # Volume names match the pre-restructure deploy so live data
  # carries forward unchanged.
  vas-ms-v2-postgres-data:
    name: vas-ms-v2-postgres-data
  vas-ms-v2-redis-data:
    name: vas-ms-v2-redis-data

  ruth-postgres-data:
    name: ruth-ai-vas-postgres-data
  ruth-redis-data:
    name: ruth-ai-vas-redis-data
